<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Super Hero</title>
<style>
/* Typography - font, size, weight, colour for the whole page */
body {
    background-color: pink;
    color: rgb(122, 74, 82);
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    padding: 20px;
}
/* Typography + Text Shadow - bold title with a purple shadow */
h1 {
    font-size: 80px;
    font-weight: bold;
    color: rgb(160, 90, 90);
    text-shadow: 4px 4px purple;
}
/* Typography + Text Transform - tagline becomes Title Case */
.tagline {
    font-style: italic;
    color: rgb(93, 93, 179);
    text-transform: capitalize;
}
/* Text Transform + Text Decoration - section heading in CAPS with underline */
.label {
    text-transform: uppercase;
    text-decoration: underline;
    transform-rotation: 45 degree;
    color: antiquewhite;
    background-color: rgb(122, 74, 82);
    padding: 5px 10px;
}


</style>
</head>
<body>

    <h1>Captain Awesome</h1>
    <p class="tagline">defender of the digital world</p>
    
    <h2 class="label">Super Powers</h2>
    <ul>
        <li>Lightning fast typing speed</li>
        <li>Fixes broken code in a single bound</li>
        <li>Never loses a CSS file</li>
    </ul>

</body>
</html>
