<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishika Profile</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    width: 300px;
    background: white;
    text-align: center;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.profile {
    position: relative;
    width: 100%;
    height: 390px;
    overflow: hidden;
    border-radius: 8px;
    background: #e6efff;
}

.profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.play-button {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 65px;
    height: 65px;
    background: white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 3px 10px #0003;
    cursor: pointer;
}

.play-button span {
    color: #e74c3c;
    font-size: 27px;
    margin-left: 5px;
}

h2 {
    margin: 15px 0 8px;
    color: #252525;
    font-size: 23px;
}

p {
    font-size: 13px;
    color: #777;
    line-height: 1.6;
    margin: 0;
}

.line {
    height: 4px;
    background: #ddd;
    margin-top: 15px;
    border-radius: 10px;
}

.line div {
    width: 30%;
    height: 4px;
    background: #e74c3c;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="card">

    <div class="profile">
        <img src="krishika.png" alt="Krishika">

        <div class="play-button" onclick="showMessage()">
            <span>▶</span>
        </div>
    </div>

    <div class="line"><div></div></div>

    <h2>Krishika</h2>

    <p>
        Krishika is 16 years old and is a bright,
        creative and enthusiastic student.
        She loves learning new things and exploring
        her interests.
    </p>

</div>

<script>
function showMessage() {
    alert("Welcome to Krishika's Profile!");
}
</script>

</body>
</html>
