<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Methods and Loops</title>
</head>
<body>

    
    <h1>Methods and Loops</h1>
    <p>Numbers from 1 to 10.</p>
    <div id="numbers"></div>

    <script>
        
        let text = "";
        for (let i = 1; i <= 10; i++) {
            text += i + "<br>";
        }
        document.getElementById("numbers").innerHTML = text;

        
        let randomNumber = Math.floor(Math.random() * 100);
        
        
        let randomElement = document.createElement("p");
        randomElement.innerHTML = "The random number is " + randomNumber;
        document.body.appendChild(randomElement);

        
        let dayNumber = new Date().getDay();
        
        let dayElement = document.createElement("p");
        dayElement.innerHTML = "Today's day number is " + dayNumber + " (0 is Sunday)";
        document.body.appendChild(dayElement);
    </script>

</body>
</html>
