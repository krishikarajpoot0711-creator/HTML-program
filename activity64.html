<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Codingal Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: Arial, sans-serif;
        }

        nav {
            background: #222222;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 21.5%;
        }

        .logo {
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .logo span {
            color: #ffcc00;
            font-size: 23px;
        }

        .nav-links {
            display: flex;
            gap: 45px;
        }

        .nav-links a {
            color: #dddddd;
            text-decoration: none;
            font-size: 10px;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: #ffcc00;
        }

        #content {
            text-align: center;
            margin-top: 100px;
            padding: 30px;
        }

        #content h1 {
            font-size: 35px;
            margin-bottom: 20px;
            color: #222;
        }

        #content p {
            font-size: 17px;
            color: #555;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">
        <span>&lt;/&gt;</span> CODINGAL
    </div>

    <div class="nav-links">
        <a onclick="showContent('about')">About</a>
        <a onclick="showContent('projects')">Projects</a>
        <a onclick="showContent('social')">Social Media</a>
        <a onclick="showContent('resume')">Resume</a>
    </div>
</nav>

<div id="content">
    <h1>Welcome to My Website</h1>
    <p>Click any navbar item to explore!</p>
</div>

<script>
    function showContent(section) {
        const content = document.getElementById("content");

        if (section === "about") {
            content.innerHTML = `
                <h1>About Me</h1>
                <p>Hello! I am a student and a beginner web developer.</p>
                <p>I love coding and creating amazing websites.</p>
            `;
        }

        else if (section === "projects") {
            content.innerHTML = `
                <h1>My Projects</h1>
                <p>Here are some projects I have created:</p>
                <p>1. Tic Tac Toe Game</p>
                <p>2. Arduino Piano</p>
                <p>3. Personal Portfolio Website</p>
            `;
        }

        else if (section === "social") {
            content.innerHTML = `
                <h1>Social Media</h1>
                <p>Connect with me on my social media platforms!</p>
                <p>Instagram | GitHub | LinkedIn</p>
            `;
        }

        else if (section === "resume") {
            content.innerHTML = `
                <h1>My Resume</h1>
                <p>Name: Your Name</p>
                <p>Skills: HTML, CSS, JavaScript</p>
                <p>Education: Student</p>
            `;
        }
    }
</script>

</body>
</html>
