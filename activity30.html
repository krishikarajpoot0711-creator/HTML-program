<!DOCTYPE html>
<html lang="en">
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Hobby Hub</title>
<link href="https://jsdelivr.net" rel="stylesheet">


<style>
  .container {
    max-width: 1140px;
    margin-right: auto;
    margin-left: auto;
    padding-right: 15px;
    padding-left: 15px;
  }


  .container-fluid {
    width: 100%;
    padding-right: 15px;
    padding-left: 15px;
    margin-right: auto;
    margin-left: auto;
  }


  .mt-4 {
    margin-top: 1.5rem;
  }


  .my-3 {
    margin-top: 1rem;
    margin-bottom: 1rem;
  }


  .p-3 {
    padding: 1rem;
  }


  .border {
    border: 1px solid #dee2e6;
  }


  .border-dark {
    border-color: #020c16;
  }


  .bg-warning {
    background-color: #c5ad66;
    color: #000;
  }


  .bg-info {
    background-color: #c282db;
  }


  .bg-danger {
    background-color: #ce6670;
  }


  .bg-light {
    background-color: #80a3c6;
    color: #212529;
  }


  .text-white {
    color: #fff;
  }


  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: #ffffff;
    color: #212529;
  }
</style>


</head>
<body>


<div class="container-fluid mt-4">
  <div class="bg-warning border border-dark p-3 my-3">
    <h2>Drawing</h2>
    <p>I enjoy drawing animals and making my own comic strips.</p>
  </div>


  <div class="bg-info text-white border border-dark p-3 my-3">
    <h2>Coding</h2>
    <p>Building websites with HTML, CSS, and Bootstrap is my favourite thing to learn!</p>
  </div>


  <div class="bg-danger text-white p-3 my-3">
    <h2>Sports</h2>
    <p>I play cricket and love going for swimming at the weekends.</p>
  </div>


  <div class="bg-light border border-dark p-3 my-3">
    <h2>Music</h2>
    <p>I am learning to play the keyboard and enjoy listening to pop music.</p>
  </div>



</body>
</html>
