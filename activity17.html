<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App Homepage</title>
    <style>
        
        body {
            background-color: #87ceeb;
            background-image: radial-gradient(circle, white 2px, transparent 3px);
            background-size: 40px 40px;
            background-repeat: repeat;
            background-position: top center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        
        .weather-card {
            width: 400px;
            border: 3px solid white;
            /* Added linear gradient for the card background as requested in Step 3 */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Main Weather Card Container -->
    <div class="weather-card">
        <h2>Weather Forecast</h2>
        <p>Your weather application content goes here.</p>
    </div>

</body>
</html>
