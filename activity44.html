<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Array Methods</h2>
<h2>join() and pop()</h2>
<p>The join() method joins array elements into a string and the pop() method removes the last element from an array.</p>

<p id="myjoin"></p>
<p id="myfirstpop"></p>
<p id="mysecondpop"></p>

<script>
var food = ["Pasta", "Pizza", "Boba tea", "Fries"];
document.getElementById("myjoin").innerHTML = food.join(" * ");
document.getElementById("myfirstpop").innerHTML = food;
food.pop();
document.getElementById("mysecondpop").innerHTML = food;
</script>

</body>
</html>
