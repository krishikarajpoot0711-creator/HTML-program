<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
   
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body {
            background-color: #80c0ff;
            padding: 20px;
        }
        .jumbotron {
            padding: 2rem;
            background-color: #f87fdc;
            border-radius: 0.3rem;
            margin-bottom: 2rem;
        }
        .jumbotron h1 {
            font-size: 2.5rem;
            font-weight: bold;
        }
        .section-title {
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="jumbotron">
            <h1 class="display-4">Dashboard</h1>
            <p class="lead">Welcome to your learning progress dashboard.</p>
            <hr class="my-4">
            
            <div class="mb-3">
                <button type="button" class="btn btn-primary me-2">Math</button>
                <button type="button" class="btn btn-success me-2">Science</button>
                <button type="button" class="btn btn-warning me-2">English</button>
                <button type="button" class="btn btn-danger">Coding</button>
            </div>
        </div>

        
        <h2 class="section-title">Lessons Completed <span class="badge bg-primary">24</span></h2>
        <ul class="list-group mb-4">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Math Lessons
                <span class="badge bg-success rounded-pill">6</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Science Lessons
                <span class="badge bg-danger rounded-pill">5</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                English Lessons
                <span class="badge bg-warning text-dark rounded-pill">7</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Coding Lessons
                <span class="badge bg-info text-dark rounded-pill">6</span>
            </li>
        </ul>

    
        <h2 class="section-title">Subject Progress</h2>
        
        <label class="form-label">Math</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" role="progressbar" style="width: 80%;" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">80%</div>
        </div>

        <label class="form-label">Science</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" role="progressbar" style="width: 65%;" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100">65%</div>
        </div>

        <label class="form-label">English</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" role="progressbar" style="width: 90%;" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100">90%</div>
        </div>

        <label class="form-label">Coding</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger" role="progressbar" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">75%</div>
        </div>
    </div>

</body>
</html>
