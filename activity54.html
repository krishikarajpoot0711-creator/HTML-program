<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown Tracker</title>
    <style>
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .birthday-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 4px solid #fff;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #ff4a75;
            margin-bottom: 10px;
        }

        p.instruction {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        button {
            background-color: #ff4a75;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 74, 117, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: #e03861;
            transform: scale(1.05);
        }

        .output-box {
            background-color: #fff5f7;
            border: 1px dashed #ffb3c6;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }
    </style>
</head>
<body>

    
    <div class="birthday-card">
        <h1>Birthday Tracker</h1>
        <p class="instruction">Click the button below to check your birthday countdown and review project variables.</p>
        
        <button onclick="checkBirthday()">Check Birthday</button>

        
        <div class="output-box" id="outputArea">
            <em>Results will appear here...</em>
        </div>
    </div>

    <script>
       
        function checkBirthday() {
            
            
            let missingGift = null;
            let undefinedPlan;

            
            const studentName = "Krishika";
            const birthdayMonth = 11; 
            const birthdayDate = 7;  

            let message = "";
            let countdownText = "";

            
            let today = new Date();
            let currentYear = today.getFullYear();
            
            
            let birthday = new Date(currentYear, birthdayMonth - 1, birthdayDate);

           
            today.setHours(0,0,0,0);
            birthday.setHours(0,0,0,0);

            
            if (today > birthday) {
                birthday.setFullYear(currentYear + 1);
            }

           
            let timeDifference = birthday.getTime() - today.getTime();
            let daysLeft = Math.ceil(timeDifference / (1000 * 60 * 60 * 24));

            if (daysLeft === 0 || daysLeft === 365) {
                message = "Happy Birthday! Have a fantastic day celebrating!";
            } else if (daysLeft <= 7) {
                message = "Get ready! Your birthday is coming up in just a few days!";
            } else if (daysLeft <= 30) {
                message = "Your birthday is less than a month away! Excitement is building.";
            } else {
                message = "Your birthday is still a bit far away, but the countdown is on!";
            }

            
            countdownText = "Days left until your next birthday: " + daysLeft;

            let finalOutput = "<strong>Student Name:</strong> " + studentName + "<br>" +
                              "<strong>Status:</strong> " + message + "<br>" +
                              "<strong>Countdown:</strong> " + countdownText + "<br><br>" +
                              "<strong>---Important---</strong><br>" +
                              "Missing Gift Variable: " + missingGift + "<br>" +
                              "Undefined Plan Variable: " + undefinedPlan;

            
            document.getElementById("outputArea").innerHTML = finalOutput;
        }
    </script>
</body>
</html>
