<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;    
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 30px;
        }

        .container {
            background-color: #252525;
            padding: 25px;
            max-width: 900px;
            margin: auto;
        }

        h2 {
            color: #ffcc00;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .projects {
            display: flex;
            justify-content: space-between;
            gap: 25px;
        }

        .card {
            background-color: white;
            width: 32%;
            padding: 15px;
            border-radius: 3px;
            text-align: left;
        }

        .image {
            height: 130px;
            background-color: #f1f1f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 75px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 17px;
            margin-bottom: 10px;
            color: #222;
        }

        .card p {
            font-size: 12px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 15px;
        }

        button {
            background-color: #ffcc00;
            color: black;
            border: none;
            padding: 9px 14px;
            cursor: pointer;
            font-size: 12px;
        }

        button:hover {
            background-color: #e6b800;
        }

        @media (max-width: 650px) {
            .projects {
                flex-direction: column;
            }

            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>My Projects</h2>

        <div class="projects">

            <div class="card">
                <div class="image">💬</div>
                <h3>Messaging Web App</h3>
                <p>
                    Connect with friends and send messages
                    easily using this application.
                </p>
                <button onclick="showProject('Messaging Web App')">
                    See Project
                </button>
            </div>

            <div class="card">
                <div class="image">🚴</div>
                <h3>Fitness Web App</h3>
                <p>
                    Stay healthy and active with our
                    simple fitness application.
                </p>
                <button onclick="showProject('Fitness Web App')">
                    See Project
                </button>
            </div>

            <div class="card">
                <div class="image">🛍️</div>
                <h3>E-Commerce Platform</h3>
                <p>
                    Explore different products and
                    enjoy online shopping.
                </p>
                <button onclick="showProject('E-Commerce Platform')">
                    See Project
                </button>
            </div>

        </div>
    </div>

    <script>
        function showProject(projectName) {
            alert("You selected: " + projectName);
        }
    </script>

</body>
</html>
