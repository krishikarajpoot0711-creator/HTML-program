<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Media Adventure</title>
</head>
<body>

    <!-- Step 2: Add the Space Mission Gallery -->
    <h1>Space Mission Gallery</h1>
    <p>Explore the wonders of space exploration through these cosmic missions.</p>
    
    <!-- Three square images with consistent width and height -->
    <img src="space1.jpg" alt="Astronaut walking on the moon" width="300" height="300">
    <img src="space2.jpg" alt="Rocket launching into orbit" width="300" height="300">
    <img src="space3.jpg" alt="Distant colorful galaxy captured by telescope" width="300" height="300">

    <hr>

    <!-- Step 3: Add the Aquatic Beats Party -->
    <h2>Aquatic Beats Party</h2>
    
    <!-- Audio tag with controls and loop -->
    <p>Listen to some happy music:</p>
    <audio src="happy-music.mp3" controls loop></audio>

    <!-- Video tag with poster, controls, and loop -->
    <p>Watch the aquatic animal video:</p>
    <video src="aquatic-animals.mp4" poster="video-preview.jpg" controls loop width="600"></video>

    <hr>

    <!-- Step 4: Add the Super Game Zone -->
    <h2>Super Game Zone</h2>
    <p>Play this fun Scratch game directly inside our webpage:</p>
    
    <!-- iframe section embedding a Scratch game -->
    <iframe src="https://scratch.mit.edu/projects/PROJECT_ID/embed" allowtransparency="true" width="485" height="402" frameborder="0" scrolling="no" allowfullscreen></iframe>

</body>
</html>
