<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript For Loops</h2>
        <p id="demo"></p>
        <script>
            var numbers = ["7", "11", "33", "20", "10", "1"];
            var text = "";
            var i;
            for (i = 0; i < numbers.length; i++){
                text += numbers[i] + "<br>";
            }

            document.getElementById("demo").innerHTML = text;
    
        </script>
    </body>
</html>
